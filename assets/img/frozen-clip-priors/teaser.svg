<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Frozen CLIP Priors overview</title>
  <desc id="desc">Schematic showing photon-limited measurements, physics-aware data consistency, a frozen CLIP prior with lightweight decoder, and self-supervised reconstruction.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fbf7fb"/><stop offset="1" stop-color="#f5f7fb"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#b5179e"/><stop offset="1" stop-color="#7b2cbf"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#777"/></marker>
  </defs>
  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <text x="600" y="50" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" fill="#202124">Foundation representations as priors for photon-limited inverse imaging</text>

  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <rect x="55" y="105" width="230" height="190" rx="20" fill="#fff" stroke="#ded8df"/>
    <text x="170" y="143" text-anchor="middle" font-size="19" font-weight="700" fill="#222">Measurement</text>
    <rect x="87" y="165" width="166" height="88" rx="12" fill="#20252b"/>
    <g fill="#b5179e" opacity=".7"><circle cx="110" cy="188" r="3"/><circle cx="135" cy="215" r="4"/><circle cx="164" cy="180" r="2.5"/><circle cx="193" cy="230" r="3"/><circle cx="225" cy="198" r="4"/></g>
    <text x="170" y="281" text-anchor="middle" font-size="15" fill="#666">Poisson-corrupted y</text>

    <rect x="360" y="105" width="230" height="190" rx="20" fill="#fff" stroke="#ded8df"/>
    <text x="475" y="143" text-anchor="middle" font-size="19" font-weight="700" fill="#222">Data consistency</text>
    <circle cx="475" cy="208" r="47" fill="#f6e8f4" stroke="#b5179e" stroke-width="2"/>
    <text x="475" y="203" text-anchor="middle" font-size="20" font-weight="700" fill="#b5179e">A, y</text>
    <text x="475" y="226" text-anchor="middle" font-size="13" fill="#555">closed-form update</text>
    <text x="475" y="281" text-anchor="middle" font-size="15" fill="#666">operator-aware</text>

    <rect x="665" y="105" width="230" height="190" rx="20" fill="#fff" stroke="#ded8df"/>
    <text x="780" y="143" text-anchor="middle" font-size="19" font-weight="700" fill="#222">Frozen CLIP prior</text>
    <rect x="700" y="174" width="160" height="38" rx="10" fill="#eee9f5"/>
    <text x="780" y="199" text-anchor="middle" font-size="15" font-weight="700" fill="#5f3c83">RN50 encoder · frozen</text>
    <rect x="700" y="221" width="160" height="38" rx="10" fill="#f6e8f4"/>
    <text x="780" y="246" text-anchor="middle" font-size="15" font-weight="700" fill="#b5179e">decoder · trainable</text>
    <text x="780" y="281" text-anchor="middle" font-size="15" fill="#666">shared across iterations</text>

    <rect x="970" y="105" width="175" height="190" rx="20" fill="#fff" stroke="#ded8df"/>
    <text x="1057" y="143" text-anchor="middle" font-size="19" font-weight="700" fill="#222">Reconstruction</text>
    <rect x="1001" y="165" width="112" height="88" rx="12" fill="url(#accent)" opacity=".88"/>
    <path d="M1015 238 L1040 210 L1055 224 L1083 185 L1100 205" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1057" y="281" text-anchor="middle" font-size="15" fill="#666">x̂</text>
  </g>

  <g stroke="#777" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M292 200 H346"/><path d="M597 200 H651"/><path d="M902 200 H956"/></g>

  <rect x="348" y="336" width="504" height="58" rx="18" fill="#fff" stroke="#b5179e" stroke-width="1.5"/>
  <text x="600" y="360" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#b5179e">Self-supervision without clean targets</text>
  <text x="600" y="383" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#555">GR2R measurement re-corruption + Equivariant Imaging</text>
</svg>
