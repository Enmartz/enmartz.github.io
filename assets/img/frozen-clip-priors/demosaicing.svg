<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Severe Poisson demosaicing results on BSDS500</title>
  <desc id="desc">Horizontal bars compare GSPnP, RAM, Ours Self, and Ours Supervised at gamma 0.05 using PSNR, with SSIM values also displayed.</desc>
  <rect width="1200" height="430" rx="26" fill="#faf9fb"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="60" y="54" font-size="26" font-weight="700" fill="#222">Poisson demosaicing · BSDS500 · γ = 0.05</text>
    <text x="60" y="82" font-size="15" fill="#666">PSNR bars use a 25.5–27.1 dB axis; SSIM is shown at right.</text>

    <g font-size="16" fill="#333">
      <text x="60" y="145">GSPnP</text><text x="60" y="215">RAM</text><text x="60" y="285" font-weight="700">Ours (Self)</text><text x="60" y="355" font-weight="700">Ours (Sup)</text>
    </g>

    <g fill="#e1e1e5"><rect x="230" y="122" width="720" height="32" rx="9"/><rect x="230" y="192" width="720" height="32" rx="9"/><rect x="230" y="262" width="720" height="32" rx="9"/><rect x="230" y="332" width="720" height="32" rx="9"/></g>
    <rect x="230" y="122" width="450" height="32" rx="9" fill="#9b9ba1"/>
    <rect x="230" y="192" width="302" height="32" rx="9" fill="#9b9ba1"/>
    <rect x="230" y="262" width="666" height="32" rx="9" fill="#b5179e"/>
    <rect x="230" y="332" width="693" height="32" rx="9" fill="#7b2cbf"/>

    <g font-size="15" font-weight="700"><text x="692" y="145" fill="#444">26.50 dB</text><text x="544" y="215" fill="#444">26.17 dB</text><text x="907" y="285" fill="#b5179e">26.98 dB</text><text x="934" y="355" fill="#7b2cbf">27.04 dB</text></g>
    <g font-size="15" fill="#555"><text x="1010" y="145">SSIM 0.6945</text><text x="1010" y="215">SSIM 0.7178</text><text x="1010" y="285" font-weight="700" fill="#b5179e">SSIM 0.7579</text><text x="1010" y="355" font-weight="700" fill="#7b2cbf">SSIM 0.7522</text></g>

    <line x1="230" y1="390" x2="950" y2="390" stroke="#aaa"/>
    <g font-size="12" fill="#777" text-anchor="middle"><text x="230" y="413">25.5</text><text x="455" y="413">26.0</text><text x="680" y="413">26.5</text><text x="905" y="413">27.0</text></g>
  </g>
</svg>
